name: android-core

# M1 spike: prove the unmodified upstream RPCS3 core (rpcs3_emu) compiles for
# android-arm64 with the NDK. Bring-up config is WITH_LLVM=OFF (interpreters);
# the LLVM prebuilt from the llvm-android workflow gets wired in afterwards.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'native/**'
      - 'patches/**'
      - 'app/**'
      - '.gitmodules'
      - 'ci/**'
      - '.github/workflows/android-core.yml'

env:
  # rpcs3 master uses ffmpeg 7.1+ APIs (AVCodecConfig in util/media_utils.cpp)
  FFMPEG_VER: n7.1.1
  # LLVM 22 android-aarch64 prebuilt produced by the llvm-android workflow.
  # arm64 requires LLVM: Emu/CPU/Backends/AArch64/* assume it unconditionally
  # (the arm64-without-LLVM config has never existed upstream).
  LLVM_RUN_ID: "30952529252"
  LLVM_ARTIFACT: llvm-android-aarch64-ca7933e47d
  # NDK r28c. The ubuntu-24.04 runner image ships the Android SDK + NDK
  # baked in; we pin the exact NDK and install it via the image's sdkmanager
  # only if the image has rotated it out.
  NDK_VERSION: 28.2.13676358

jobs:
  build-core:
    strategy:
      matrix:
        include:
          # Shipping baseline: Snapdragon targets all support v8.1 LSE.
          - baseline: armv8.1-a
            artifact: libcellstation-arm64-v8a
          # Compat lane for the emulator boot test: the arm64-on-x86_64
          # binary translator SIGILLs on LSE instructions.
          - baseline: armv8-a
            artifact: libcellstation-arm64-v8a-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Init rpcs3 submodule (shallow; skip llvm, ffmpeg, MoltenVK)
        run: |
          git submodule update --init --depth 1 rpcs3
          cd rpcs3
          for m in $(git submodule status | awk '{print $2}' | grep -vE 'llvm|ffmpeg|MoltenVK'); do
            git submodule update --init --depth 1 "$m"
          done

      - name: Init libadrenotools submodule (custom GPU driver loading)
        run: git submodule update --init --recursive --depth 1 native/3rdparty/libadrenotools

      - name: Apply patch series
        run: sh ci/apply-patches.sh

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache nasm

      - name: Set up pinned NDK
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-core-${{ matrix.baseline }}-${{ github.sha }}
          restore-keys: ccache-android-core-${{ matrix.baseline }}-

      - name: Cache ffmpeg (android-aarch64)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-android
          key: ffmpeg-${{ env.FFMPEG_VER }}-android29-arm64-ndk${{ env.NDK_VERSION }}

      - name: Build ffmpeg (android-aarch64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          git clone --depth 1 --branch "$FFMPEG_VER" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --prefix="$HOME/ffmpeg-android" \
            --enable-cross-compile --target-os=android --arch=aarch64 --cpu=armv8-a \
            --cc="$TC/bin/aarch64-linux-android29-clang" \
            --cxx="$TC/bin/aarch64-linux-android29-clang++" \
            --ar="$TC/bin/llvm-ar" --ranlib="$TC/bin/llvm-ranlib" \
            --nm="$TC/bin/llvm-nm" --strip="$TC/bin/llvm-strip" \
            --enable-static --disable-shared --enable-pic \
            --disable-programs --disable-doc --disable-avdevice \
            --disable-avfilter --disable-postproc --disable-network \
            --disable-vulkan
          make -j"$(nproc)"
          make install

      - name: Fetch LLVM prebuilt (android-aarch64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh run download "$LLVM_RUN_ID" -n "$LLVM_ARTIFACT" --repo "$GITHUB_REPOSITORY" -D /tmp/llvm-dl
          tar -C "$HOME" -xzf /tmp/llvm-dl/llvm-android-aarch64.tar.gz
          test -f "$HOME/llvm-android/lib/cmake/llvm/LLVMConfig.cmake"

      - name: Configure (NDK, WITH_LLVM=ON, prebuilt LLVM 22)
        run: |
          set -eux
          cmake -S native -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_FFMPEG_ROOT="$HOME/ffmpeg-android" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=OFF \
            -DSTATIC_LINK_LLVM=ON \
            -DLLVM_DIR="$HOME/llvm-android/lib/cmake/llvm" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DRPCS3_ARM_BASELINE=${{ matrix.baseline }}

      - name: Build libcellstation.so
        run: |
          cmake --build build --target cellstation -j"$(nproc)"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded -o build/bridge/libcellstation.stripped.so build/bridge/libcellstation.so
          for hook in libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded -o "build/bridge/$hook" "build/adrenotools/src/hook/$hook"
          done
          ls -la build/bridge/*.so

      - name: Upload libcellstation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bridge/libcellstation.stripped.so
            build/bridge/lib*_hook.so
            build/bridge/libhook_impl.so
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  build-apk:
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libcellstation
        uses: actions/download-artifact@v4
        with:
          name: libcellstation-arm64-v8a
          path: /tmp/cellstation-lib

      - name: Place native lib
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/cellstation-lib/libcellstation.stripped.so app/src/main/jniLibs/arm64-v8a/libcellstation.so
          cp /tmp/cellstation-lib/lib*hook*.so app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cellstation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # Signed release APK around the shipping armv8.1 lib — what the release
  # pages publish. Signed with the committed CI keystore (stable sideload
  # identity, not a secret; see app/build.gradle.kts).
  build-apk-release:
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count, one monotonic
          # counter shared with tagged releases so versionCode always upgrades.
          fetch-depth: 0

      - name: Fetch libcellstation
        uses: actions/download-artifact@v4
        with:
          name: libcellstation-arm64-v8a
          path: /tmp/cellstation-lib

      - name: Place native lib
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/cellstation-lib/libcellstation.stripped.so app/src/main/jniLibs/arm64-v8a/libcellstation.so
          cp /tmp/cellstation-lib/lib*hook*.so app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        working-directory: app
        run: |
          set -eux
          build=$(git rev-list --count HEAD)
          export CELLSTATION_VERSION="nightly.${build}"
          export CELLSTATION_VERSION_CODE="$build"
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: cellstation-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # Same APK but around the armv8-a compat lib - only used by the emulator
  # boot test (the translator SIGILLs on the shipping armv8.1 build).
  build-apk-compat:
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch compat libcellstation
        uses: actions/download-artifact@v4
        with:
          name: libcellstation-arm64-v8a-compat
          path: /tmp/cellstation-lib

      - name: Place native lib
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/cellstation-lib/libcellstation.stripped.so app/src/main/jniLibs/arm64-v8a/libcellstation.so
          cp /tmp/cellstation-lib/lib*hook*.so app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK (compat)
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK (compat)
        uses: actions/upload-artifact@v4
        with:
          name: cellstation-debug-apk-compat
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15

  # Boot-test on an Android emulator. GitHub's Apple-silicon runners cannot
  # run arm64 AVDs (no nested virtualization: HVF error HV_UNSUPPORTED), so
  # this uses a KVM-accelerated x86_64 image whose bundled ndk_translation
  # runs our arm64-v8a lib. Payload: the RPCS3 team's own GPL homebrew test
  # ELFs from the submodule — never commercial content.
  integration-test:
    needs: build-apk-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Init rpcs3 submodule (payload ELFs only)
        run: git submodule update --init --depth 1 rpcs3

      - name: Build translator probe
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -static -O1 -march=armv8-a -o translator-probe ci/translator-probe.c

      - name: Fetch APK (compat)
        uses: actions/download-artifact@v4
        with:
          name: cellstation-debug-apk-compat
          path: /tmp/apk

      - name: Boot gs_gcm_tetris.elf on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -gpu swiftshader_indirect -camera-back none
          script: bash ci/integration-test.sh "$(ls /tmp/apk/*.apk | head -1)" rpcs3/bin/test/gs_gcm_tetris.elf translator-probe

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logcat
          path: logcat.txt
          if-no-files-found: ignore

  # Rolling "nightly" pre-release: every master push whose full chain is green
  # (both core lanes -> APKs -> emulator boot test) republishes the signed
  # release APK under a stable asset name, so the release page always links
  # the newest build that provably boots homebrew.
  release-nightly:
    needs: [build-apk-release, integration-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APK (release)
        uses: actions/download-artifact@v4
        with:
          name: cellstation-release-apk
          path: dist

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mv dist/*.apk dist/CellStation-nightly.apk
          short=${GITHUB_SHA::7}
          cat > notes.md <<EOF
          Rolling release build from master @ ${short} — published only after this exact commit booted PS3 homebrew in CI (build, install, EMULATE intent, RSX active).

          Asset: CellStation-nightly.apk — arm64 (armv8.1+) release build for Snapdragon handhelds (AYN Odin, Thor, ...). Signed with the public CI key: a stable sideload identity, not an authenticity guarantee.

          Build provenance: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          CellStation is an unofficial Android port of RPCS3 (https://github.com/RPCS3/rpcs3, GPL-2.0), not affiliated with or supported by the RPCS3 team — do not report issues there. No firmware, BIOS, or game content is included or supported.
          EOF
          # Rolling release. The tag is moved with a plain git push and the
          # release is created against the existing tag: creating refs through
          # the releases API gets 403 "Resource not accessible by integration"
          # under tag rules, while git tag pushes and tag-backed release
          # creation both work.
          git -c user.name=ci -c user.email=ci@users.noreply.github.com \
            tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          gh release delete nightly --yes || true
          gh release create nightly \
            --prerelease \
            --verify-tag \
            --title "Nightly (master @ ${short})" \
            --notes-file notes.md \
            dist/CellStation-nightly.apk
